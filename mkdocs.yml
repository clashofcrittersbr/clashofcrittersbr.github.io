site_name: Clash of Critters BR
site_description: Wiki independente em português sobre Clash of Critters.
site_url: !ENV [SITE_URL, '']
repo_name: GitHub
repo_url: https://github.com/clashofcrittersbr/clashofcrittersbr.github.io
edit_uri: edit/main/docs/
site_author: Colaboradores da Clash of Critters BR

theme:
  name: material
  language: pt-BR
  font: false
  logo: assets/icone.svg
  favicon: assets/icone.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Usar tema claro
    - media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Seguir tema do dispositivo

plugins:
  - search:
      lang: [pt, en]

hooks:
  - hooks/novidade.py
  - hooks/tataris.py

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir/CHANGELOG.md
      check_paths: true

extra_css:
  - assets/wiki.css
  - assets/tataris.css

extra_javascript:
  - assets/capitulos.js
  - assets/tataris.js

nav:
  - Início: index.md
  - Guias:
      - Comece aqui: comece-aqui.md
      - Combate e elementos: guias/combate.md
      - Tataris e evolução: guias/tataris.md
      - Pyropup: guias/pyropup.md
      - Pinball e recursos: guias/recursos.md
      - Desafio de Chefe: guias/desafio-de-chefe.md
      - Álbum de Cartas: guias/album-de-cartas.md
  - Tataris: tataris.md
  - Tier list: guias/tier-list.md
  - Formações:
      - Visão geral: formacoes/index.md
      - Modo História: formacoes/modo-historia.md
      - Dojo: formacoes/dojo.md
      - Horda: formacoes/horda.md
  - Eventos:
      - Visão geral: eventos/index.md
      - Caça ao Tesouro: eventos/caca-ao-tesouro.md
      - Concurso de Pesca: eventos/concurso-de-pesca.md
      - Tiro aos Zobos: eventos/tiro-aos-zobos.md
  - Novidades: novidades.md
  - Colabore: colabore.md

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
